
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WHACK-A-CAT</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="arcade-machine">

    <header class="machine-header">
      <button id="settingsBtn" class="settings-btn">⚙ SETTINGS</button>

      <div class="marquee">
        <div class="marquee-lights">✦ ✦ ✦ ✦ ✦ ✦ ✦ ✦ ✦</div>
        <h1>WHACK-A-CAT</h1>
        <p>THE ULTIMATE CAT BONKING GAME</p>
        <div class="marquee-lights">✦ ✦ ✦ ✦ ✦ ✦ ✦ ✦ ✦</div>
      </div>
    </header>

    <section class="machine-screen">

      <aside class="side-panel left-panel">
        <div class="panel-heading" id="playerDisplay">PLAYER 1</div>

        <div class="stat-box">
          <span class="stat-label">SCORE</span>
          <strong id="score">000000</strong>
        </div>

        <div class="stat-box">
          <span class="stat-label">HIGH SCORE</span>
          <strong id="highScore">000000</strong>
        </div>

        <div class="panel-decoration">★ ★ ★</div>
        <div class="panel-sticker">CAT<br>POWER!</div>
      </aside>

      <section class="game-area">
        <div class="screen-top">
          <span>★ CAT ARENA ★</span>
          <span class="screen-indicator">● LIVE</span>
        </div>

        <div id="board"></div>

        <div id="message" aria-live="polite">READY TO BONK?</div>

        <button id="start">START GAME</button>
      </section>

      <aside class="side-panel right-panel">
        <div class="panel-heading">GAME DATA</div>

        <div class="stat-box">
          <span class="stat-label">TIME LEFT</span>
          <strong id="time">30</strong>
        </div>

        <div class="stat-box">
          <span class="stat-label">COINS</span>
          <strong id="coins">0</strong>
        </div>

        <div class="panel-decoration">♦ ♦ ♦</div>
        <div class="panel-sticker sticker-right">BONK<br>MASTER!</div>
      </aside>

    </section>

    <footer class="machine-controls">
      <div class="speaker">
        <span></span><span></span><span></span>
        <span></span><span></span><span></span>
      </div>

      <div class="control-center">
        <div class="control-lights">
          <i></i><i></i><i></i>
        </div>
        <p>WHACK • SCORE • REPEAT</p>
        <div class="control-buttons">
          <span class="button-red"></span>
          <span class="button-yellow"></span>
          <span class="button-blue"></span>
        </div>
      </div>

      <div class="speaker">
        <span></span><span></span><span></span>
        <span></span><span></span><span></span>
      </div>
    </footer>

  </main>

  <!-- SETTINGS WINDOW -->
  <div id="settingsModal" class="settings-modal">
    <div class="settings-box">
      <h2>⚙️ SETTINGS</h2>

      <label for="playerName">PLAYER NAME</label>
      <input id="playerName" maxlength="16" placeholder="PLAYER 1">

      <button id="saveName">SAVE NAME</button>

      <hr>

      <button id="musicToggle">🎵 MUSIC: ON</button>
      <p class="settings-note">Music preference saved for later.</p>

      <hr>

      <button id="resetData" class="danger-btn">
        🗑 RESET GAME DATA
      </button>

      <button id="closeSettings">CLOSE</button>
    </div>
  </div>

  <script>
    // GAME ELEMENTS
    const board = document.querySelector("#board");
    const scoreText = document.querySelector("#score");
    const highScoreText = document.querySelector("#highScore");
    const timeText = document.querySelector("#time");
    const coinsText = document.querySelector("#coins");
    const message = document.querySelector("#message");
    const start = document.querySelector("#start");

    // SETTINGS ELEMENTS
    const settingsModal = document.querySelector("#settingsModal");
    const playerNameInput = document.querySelector("#playerName");
    const playerDisplay = document.querySelector("#playerDisplay");
    const musicToggle = document.querySelector("#musicToggle");

    // SAVED DATA
    let highScore = Number(localStorage.getItem("wacHighScore")) || 0;
    let coins = Number(localStorage.getItem("wacCoins")) || 0;

    let score = 0;
    let time = 30;
    let playing = false;
    let active = -1;
    let spawnTimer;
    let clockTimer;

    let musicEnabled = localStorage.getItem("wacMusic") !== "off";

    const savedName = localStorage.getItem("wacPlayerName") || "PLAYER 1";

    function updatePlayerName() {
      const name = localStorage.getItem("wacPlayerName") || "PLAYER 1";
      playerDisplay.textContent = name.toUpperCase();
    }

    function updateMusicButton() {
      musicToggle.textContent = musicEnabled
        ? "🎵 MUSIC: ON"
        : "🔇 MUSIC: OFF";

      // This setting will be used when we add actual music.
      window.wacMusicEnabled = musicEnabled;
    }

    const cats = [
      "cat-grey.png",
      "cat-white.png",
      "cat-orange.png",
      "cat-calico.png",
      "cat-grumpy.png",
      "cat-cream.png"
    ];

    const formatScore = value => String(value).padStart(6, "0");

    highScoreText.textContent = formatScore(highScore);
    coinsText.textContent = coins;
    updatePlayerName();
    updateMusicButton();

    // CREATE THE NINE HOLES
    for (let i = 0; i < 9; i++) {
      const hole = document.createElement("button");
      hole.className = "hole";
      hole.textContent = "⬛";
      hole.setAttribute("aria-label", "Empty hole");

      hole.addEventListener("click", () => {
        if (!playing || i !== active) return;

        score++;
        coins++;

        scoreText.textContent = formatScore(score);
        coinsText.textContent = coins;

        localStorage.setItem("wacCoins", coins);

        if (score > highScore) {
          highScore = score;
          highScoreText.textContent = formatScore(highScore);
          localStorage.setItem("wacHighScore", highScore);
        }

        message.textContent = "BONKKKK!! +1";

        active = -1;
        clearTimeout(spawnTimer);

        const bonked = document.createElement("img");
        bonked.src = "images/cat-bonked.png";
        bonked.alt = "Bonked cat";
        bonked.className = "cat-sprite bonked-sprite";

        hole.replaceChildren(bonked);

        spawnTimer = setTimeout(() => {
          hideCat();

          if (playing) popCat();
        }, 350);
      });

      board.appendChild(hole);
    }

    function hideCat() {
      [...board.children].forEach(hole => {
        hole.textContent = "⬛";
        hole.classList.remove("active");
        hole.setAttribute("aria-label", "Empty hole");
      });

      active = -1;
    }

    function popCat() {
      if (!playing) return;

      hideCat();

      const holes = [...board.children];
      const randomHole = Math.floor(Math.random() * holes.length);
      const hole = holes[randomHole];

      const randomCat = cats[Math.floor(Math.random() * cats.length)];

      active = randomHole;

      const img = document.createElement("img");
      img.src = "images/" + randomCat;
      img.alt = "Pixel cat";
      img.className = "cat-sprite";

      img.onerror = () => {
        message.textContent = "CAT IMAGE NOT FOUND: " + randomCat;
      };

      hole.replaceChildren(img);
      hole.classList.add("active");
      hole.setAttribute("aria-label", "Whack the cat!");

      const delay = Math.max(450, 1100 - score * 25);
      spawnTimer = setTimeout(popCat, delay);
    }

    function endGame() {
      playing = false;

      clearTimeout(spawnTimer);
      clearInterval(clockTimer);

      hideCat();

      message.textContent = "GAME OVER! SCORE: " + score;
      start.textContent = "PLAY AGAIN";
    }

    // START / RESTART GAME
    start.addEventListener("click", () => {
      clearTimeout(spawnTimer);
      clearInterval(clockTimer);

      score = 0;
      time = 30;
      playing = true;

      scoreText.textContent = formatScore(score);
      timeText.textContent = time;

      message.textContent = "WHACK THAT CAT!";
      start.textContent = "RESTART";

      popCat();

      clockTimer = setInterval(() => {
        time--;
        timeText.textContent = time;

        if (time <= 0) endGame();
      }, 1000);
    });

    // OPEN SETTINGS
    document.querySelector("#settingsBtn").addEventListener("click", () => {
      playerNameInput.value =
        localStorage.getItem("wacPlayerName") || "PLAYER 1";

      settingsModal.style.display = "flex";
    });

    // CLOSE SETTINGS
    document.querySelector("#closeSettings").addEventListener("click", () => {
      settingsModal.style.display = "none";
    });

    settingsModal.addEventListener("click", event => {
      if (event.target === settingsModal) {
        settingsModal.style.display = "none";
      }
    });

    // SAVE PLAYER NAME
    document.querySelector("#saveName").addEventListener("click", () => {
      const name = playerNameInput.value.trim() || "PLAYER 1";

      localStorage.setItem("wacPlayerName", name);
      updatePlayerName();

      message.textContent = "WELCOME, " + name.toUpperCase() + "!";
    });

    // MUSIC PREFERENCE
    musicToggle.addEventListener("click", () => {
      musicEnabled = !musicEnabled;

      localStorage.setItem(
        "wacMusic",
        musicEnabled ? "on" : "off"
      );

      updateMusicButton();
    });

    // RESET DATA
    document.querySelector("#resetData").addEventListener("click", () => {
      const confirmed = confirm(
        "RESET ALL GAME DATA?\n\nThis will erase your coins, high score and player name."
      );

      if (!confirmed) return;

      clearTimeout(spawnTimer);
      clearInterval(clockTimer);

      localStorage.removeItem("wacHighScore");
      localStorage.removeItem("wacCoins");
      localStorage.removeItem("wacPlayerName");

      location.reload();
    });
  </script>
</body>
</html>
